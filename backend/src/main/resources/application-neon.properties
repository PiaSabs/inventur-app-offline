# Lokale Datei wird nicht versioniert; Umgebungsvariablen haben weiterhin Vorrang.
spring.config.import=optional:file:./application-neon.local.properties

# Alternative ohne lokale Datei: Host/Datenbank und SPRING_DATASOURCE_* bereitstellen.
spring.datasource.url=jdbc:postgresql://${NEON_HOST}:5432/${NEON_DATABASE}?sslmode=require

# Migrationen erst nach Schemapruefung und ausdruecklicher Freigabe aktivieren.
spring.flyway.enabled=false

# Keine vollstaendigen Verbindungs-URLs im Startprotokoll.
logging.level.org.hibernate.orm.connections.pooling=WARN
logging.level.org.flywaydb=WARN
